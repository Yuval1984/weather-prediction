
<div class="weather-card-container">
    <div class="temperature-fill" 
         [ngClass]="{ 'ice-background': isColdTemperature(weatherCard?.main?.temp), 'orange-background': !isColdTemperature(weatherCard?.main?.temp) }"
         [ngStyle]="{ height: getTemperatureFillPercent(weatherCard?.main?.temp) }"></div>
    <h4 class="text">{{ weatherCard?.dt_txt | date:'HH:mm' }}</h4>
    <img [src]="'https://openweathermap.org/img/wn/' + weatherIcon + '@2x.png'"
        [alt]="weatherIcon" class="weather-icon" />
    <h4 class="text temperature">{{ getTemperature() }}° C</h4>
    <h5 class="text description">{{ weatherDescription }}</h5>
    <div class="container">
        <h4 class="text description">Wind Speed: {{ weatherCard?.wind?.speed }} m/s</h4>
        <img src="assets\wind-symbols\wind.png" class="small-icon">
    </div>
    <div class="container">
        <h4 class="text description">Wind Direction: {{ weatherCard?.wind?.deg }}°</h4>
        <img src="assets\icons\arrow.svg" class="small-icon" 
        [ngStyle]="{'transform': 'rotate(' + weatherCard?.wind?.deg + 'deg)'}" />
    </div>
    <div class="container">
        <h4 class="text description">Visibility: {{ weatherCard?.visibility }} m</h4>
        <img src="assets\icons\eye.svg" class="small-icon">
    </div>
</div>
